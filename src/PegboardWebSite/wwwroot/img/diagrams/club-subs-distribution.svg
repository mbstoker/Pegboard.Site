<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-label="A chart of annual membership fees at UK badminton clubs plotted on one horizontal axis from zero to four hundred and fifty pounds. The clubs form two separate clusters with an empty stretch between them. On the left, five clubs charging a small administrative subscription between twenty and seventy pounds, who then charge four to eight pounds sixty every session on top. On the right, fourteen clubs charging an all-in season subscription with sessions included: nine of them cluster tightly between one hundred and seventy-five and two hundred and thirty pounds, the median is one hundred and ninety-seven pounds seventy-five, and a thin tail runs out to four hundred and fifty. Between seventy and one hundred and thirty pounds there is one club and otherwise nothing, which is the point of the chart: these are two different products rather than one price range.">
  <title>There is no average sub. There are two products, and almost nothing between them.</title>

  <!--
    Data: 25 UK badminton clubs, published fees read 2026-08-26. Convenience sample found through
    search - England-heavy, one Welsh club, none from Scotland or Northern Ireland. Not representative.

    Model A, all-in season sub (n=14): range £130-£450, median £197.75, IQR £175-£230.
      9 of the 14 sit inside £175-£230.
    Model B, admin sub + pay per session (n=5): sub £20-£70, median £50, sessions £4.00-£8.60.
    Model C, no membership at all (n=2): not plotted - they have no annual fee to place on this axis.

    SCALE: £0 at x=120, £450 at x=1120. 1000 units for £450 = 2.2222 units per £1.
    Dot positions are the clubs' actual published subs, not jitter.
  -->

  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="600" y="42" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">What UK badminton clubs charge as an annual sub</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">25 clubs, published fees read 26 August 2026. Each dot is one club.</text>

  <!-- axis -->
  <line x1="120" y1="400" x2="1130" y2="400" stroke="#0f172a" stroke-width="2.5"/>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="231.1" y1="150" x2="231.1" y2="400"/>
    <line x1="342.2" y1="150" x2="342.2" y2="400"/>
    <line x1="453.3" y1="150" x2="453.3" y2="400"/>
    <line x1="564.4" y1="150" x2="564.4" y2="400"/>
    <line x1="675.6" y1="150" x2="675.6" y2="400"/>
    <line x1="786.7" y1="150" x2="786.7" y2="400"/>
    <line x1="897.8" y1="150" x2="897.8" y2="400"/>
    <line x1="1008.9" y1="150" x2="1008.9" y2="400"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="120" y="424">&#163;0</text>
    <text x="231.1" y="424">&#163;50</text>
    <text x="342.2" y="424">&#163;100</text>
    <text x="453.3" y="424">&#163;150</text>
    <text x="564.4" y="424">&#163;200</text>
    <text x="675.6" y="424">&#163;250</text>
    <text x="786.7" y="424">&#163;300</text>
    <text x="897.8" y="424">&#163;350</text>
    <text x="1008.9" y="424">&#163;400</text>
    <text x="1120" y="424">&#163;450</text>
  </g>

  <!-- THE GAP: £70 to £130 -->
  <rect x="275.6" y="150" width="133.3" height="250" fill="#fef3c7" opacity="0.55"/>
  <text x="342.2" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#b45309" font-weight="600">almost nothing</text>
  <text x="342.2" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#b45309" font-weight="600">between &#163;70 and &#163;130</text>

  <!-- Model B cluster: subs £20, £50, £50, £50, £70 -->
  <g fill="#1d4ed8">
    <circle cx="164.4" cy="370" r="13"/>
    <circle cx="231.1" cy="370" r="13"/>
    <circle cx="231.1" cy="342" r="13"/>
    <circle cx="231.1" cy="314" r="13"/>
    <circle cx="275.6" cy="370" r="13"/>
  </g>
  <text x="220" y="286" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#1d4ed8" font-weight="600">Admin sub</text>
  <text x="220" y="306" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#1d4ed8">+ &#163;4.00 to &#163;8.60</text>
  <text x="220" y="326" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#1d4ed8">every session</text>

  <!-- Model A cluster: £130, £140, £150, £175, £185, £187, £196.50, £199, £210, £225, £230, £230, £240, £450 -->
  <g fill="#0f766e">
    <circle cx="408.9" cy="370" r="13"/>
    <circle cx="431.1" cy="370" r="13"/>
    <circle cx="453.3" cy="370" r="13"/>
    <circle cx="508.9" cy="370" r="13"/>
    <circle cx="531.1" cy="370" r="13"/>
    <circle cx="535.6" cy="342" r="13"/>
    <circle cx="556.7" cy="370" r="13"/>
    <circle cx="562.2" cy="342" r="13"/>
    <circle cx="586.7" cy="370" r="13"/>
    <circle cx="620.0" cy="370" r="13"/>
    <circle cx="631.1" cy="342" r="13"/>
    <circle cx="631.1" cy="314" r="13"/>
    <circle cx="653.3" cy="370" r="13"/>
    <circle cx="1120.0" cy="370" r="13"/>
  </g>

  <!-- IQR band + median -->
  <line x1="508.9" y1="286" x2="631.1" y2="286" stroke="#0f766e" stroke-width="4"/>
  <line x1="508.9" y1="278" x2="508.9" y2="294" stroke="#0f766e" stroke-width="4"/>
  <line x1="631.1" y1="278" x2="631.1" y2="294" stroke="#0f766e" stroke-width="4"/>
  <text x="570" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#0f766e">half of them, &#163;175 to &#163;230</text>

  <line x1="559.5" y1="160" x2="559.5" y2="400" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="559.5" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#b45309" font-weight="600">median &#163;197.75</text>

  <text x="700" y="196" font-family="system-ui,sans-serif" font-size="17" fill="#0f766e" font-weight="600">All-in season sub, sessions included</text>
  <text x="700" y="218" font-family="system-ui,sans-serif" font-size="15" fill="#0f766e">14 clubs, &#163;130 to &#163;450</text>

  <!-- the outlier, labelled rather than hidden -->
  <line x1="1120" y1="356" x2="1120" y2="330" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1120" y="322" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#64748b">one London club</text>

  <text x="120" y="472" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Two clubs charge no membership at all and take money at the door, so they do not appear on this axis.</text>
  <text x="120" y="496" font-family="system-ui,sans-serif" font-size="16" fill="#475569">A convenience sample found through search: England-heavy, one Welsh club, none from Scotland or Northern Ireland.</text>

  <text x="1160" y="536" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
