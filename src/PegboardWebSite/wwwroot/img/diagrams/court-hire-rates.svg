    <text x="312" y="550">sells 55 min, advertises &#163;14.50</text>
  </g>

  <line x1="945.6" y1="88" x2="945.6" y2="616" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 5"/>
  <text x="945.6" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#b45309" font-weight="600">median &#163;13.45</text>

