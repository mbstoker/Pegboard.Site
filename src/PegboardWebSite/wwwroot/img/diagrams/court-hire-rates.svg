<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="A bar chart of eighteen UK venues' adult peak badminton court prices, normalised to a sixty-minute court and sorted cheapest first. Swansea Bay Sports Park nine pounds, Newcastle University ten pounds, Plympton Academy ten pounds fifty, Benham Sports Centre twelve pounds, Danbury twelve pounds, Codsall twelve pounds fifty, Wombourne twelve pounds fifty, Botwell Green twelve pounds seventy as an upper bound only, Pateley Bridge thirteen pounds twenty-five, Tendring thirteen pounds sixty-five, Glasgow Club fourteen pounds, Oxford fourteen pounds ninety-six, Vivacity fifteen pounds, Brunel University fifteen pounds, Castle Leisure Centre Bury fifteen pounds forty-seven, Halton fifteen pounds eighty-two, Sefton sixteen pounds, and the Eric Liddell Sports Centre in London sixteen pounds twenty. The median is thirteen pounds forty-five. Education venues are marked separately and occupy both ends of the range: the three cheapest are two universities and a state school, while the single most expensive is an independent school's sports centre and a university sits mid-table at fifteen pounds. The two venues selling less than a full hour, Bury and Halton, both finish in the four most expensive; Bury advertises the fourth cheapest headline price in the entire survey.">
  <title>The three cheapest venues are education venues. So is the most expensive.</title>

  <!--
    Data: Marketing/GEO/court-hire-survey-2026-08-26/ - 24 UK venues across 22 rows, read 2026-08-26.
    18 sell a comparable per-court unit. Published rate cards and booking pages only.
    Prices NORMALISED to 60 minutes: Halton sells 55 min, Bury sells 45 min.
    Re-run analyze.mjs in that folder to reproduce every figure here.

    CORRECTED 2026-08-26 (round 1 review): Sefton was drawn at £15.00, which is the 2025/26 column
    of a document titled "Fees and Charges 2026-27". The 2026/27 charge is £16.00, so Sefton moves
    from 13th to 17th. Headline stats are unaffected: median £13.45, Q1 £12.00, Q3 £15.00.

    COLOUR: teal = university or school of any kind. The first version reserved teal for the cheap
    end, which visually asserted "education is cheaper" - false, since the dearest venue in the
    sample is an independent school's centre and Brunel sits mid-table. Education now carries one
    colour wherever it lands, and the title states the real finding.
  -->

  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="40" y="36" font-family="system-ui,sans-serif" font-size="23" fill="#0f172a" font-weight="600">What 18 UK venues charge for a badminton court</text>
  <text x="40" y="60" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">Adult peak rate, normalised to a 60-minute court &#183; published prices read 26 August 2026</text>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="540" y1="88" x2="540" y2="616"/>
    <line x1="780" y1="88" x2="780" y2="616"/>
    <line x1="1020" y1="88" x2="1020" y2="616"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="540" y="638">&#163;5</text>
    <text x="780" y="638">&#163;10</text>
    <text x="1020" y="638">&#163;15</text>
  </g>

  <!-- bars. x=300 is £0; 48 units per £1. -->
  <g>
