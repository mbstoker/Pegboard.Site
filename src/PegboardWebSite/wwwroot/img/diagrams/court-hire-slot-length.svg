<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Two pairs of bars showing how slot length reverses a price comparison. On the left, as advertised: Castle Leisure Centre in Bury shows eleven pounds sixty and Sefton shows fifteen pounds, so Bury looks cheaper. On the right, both normalised to a sixty-minute court: Bury rises to fifteen pounds forty-seven because it sells only forty-five minutes, while Sefton stays at fifteen pounds because it already sells a full hour. Bury is now the dearer of the two and the order has reversed.">
  <title>Bury advertises £11.60 against Sefton's £15.00, and is the more expensive of the two</title>

  <!--
    Data: Marketing/GEO/court-hire-survey-2026-08-26/ - both venues read 2026-08-26.
    Castle Leisure Centre (Bury Council) sells a 45-minute court at £11.60 = £15.47/hour.
    Sefton MBC sells a 60-minute court at £15.00.
    normalised() in sample.mjs does the conversion; analyze.mjs prints this exact comparison.
    Amber = the venue that looks cheaper but is not. Slate = the honest hour.
  -->

  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">The cheaper-looking price is the dearer one</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Divide by the minutes, multiply by sixty, then compare</text>

  <!-- baseline -->
  <line x1="90" y1="560" x2="1110" y2="560" stroke="#0f172a" stroke-width="2"/>

  <!-- gridlines: £5 £10 £15 at 24 units per £ from y=560 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="440" x2="1110" y2="440"/>
    <line x1="90" y1="320" x2="1110" y2="320"/>
    <line x1="90" y1="200" x2="1110" y2="200"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="end">
    <text x="82" y="445">&#163;5</text>
    <text x="82" y="325">&#163;10</text>
    <text x="82" y="205">&#163;15</text>
  </g>

  <!-- ============ LEFT: as advertised ============ -->
  <text x="360" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#0f172a" font-weight="600">What they advertise</text>

  <rect x="200" y="281.6" width="130" height="278.4" fill="#b45309"/>
  <rect x="390" y="200"   width="130" height="360"   fill="#64748b"/>

  <g font-family="system-ui,sans-serif" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="600">
    <text x="265" y="268">&#163;11.60</text>
    <text x="455" y="186">&#163;15.00</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <text x="265" y="310">for 45 min</text>
    <text x="455" y="228">for 60 min</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
    <text x="265" y="586">Bury</text>
    <text x="455" y="586">Sefton</text>
  </g>
  <text x="360" y="616" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#b45309" font-weight="600">Bury looks &#163;3.40 cheaper</text>

  <!-- divider + arrow -->
  <line x1="600" y1="130" x2="600" y2="600" stroke="#e2e8f0" stroke-width="2"/>

  <!-- ============ RIGHT: normalised ============ -->
  <text x="840" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#0f172a" font-weight="600">Per 60-minute court</text>

  <rect x="680" y="188.7" width="130" height="371.3" fill="#b45309"/>
  <rect x="870" y="200"   width="130" height="360"   fill="#64748b"/>

  <g font-family="system-ui,sans-serif" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="600">
    <text x="745" y="175">&#163;15.47</text>
    <text x="935" y="186">&#163;15.00</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">
    <text x="745" y="222">&#163;11.60 &#215; 60/45</text>
    <text x="935" y="234">unchanged</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
    <text x="745" y="586">Bury</text>
    <text x="935" y="586">Sefton</text>
  </g>
  <text x="840" y="616" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#0f172a" font-weight="600">Bury is 47p an hour dearer</text>

  <text x="1160" y="660" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
