<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Two ranked columns of the same eighteen venues. The left column ranks them by the price they advertise, cheapest at the top; Castle Leisure Centre in Bury sits fourth from cheapest at eleven pounds sixty, and Halton sits thirteenth at fourteen pounds fifty. The right column ranks the same venues by their real price per sixty-minute court. Bury has moved down to fifteenth of eighteen at fifteen pounds forty-seven, because it sells a forty-five minute court, and Halton has moved from thirteenth to sixteenth at fifteen pounds eighty-two because it sells fifty-five minutes. Lines trace both venues between the columns to show the jump. Every other venue sells a full hour and barely moves.">
  <title>Bury advertises the fourth cheapest price in the survey and charges the fourth most expensive</title>

  <!--
    Data: Marketing/GEO/court-hire-survey-2026-08-26/ - analyze.mjs prints both rankings and the
    rank movement for every venue selling under an hour. Do not hand-compute these positions.
      Castle Leisure Centre (Bury): £11.60 / 45 min. Advertised rank 4 of 18 -> real rank 15 of 18.
      Halton BC:                    £14.50 / 55 min. Advertised rank 13 of 18 -> real rank 16 of 18.

    REPLACES a pairwise Bury-vs-Sefton comparison. That version depended on Sefton's price, which
    round-1 review found had been read from the wrong column of the source document. A rank shift
    within the venue's own survey is a stronger demonstration and does not depend on any second
    venue's figure being right.
  -->

  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">The cheap-looking price is one of the dearest</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">The same 18 venues, ranked two ways. Only the slot length changed.</text>

  <text x="350" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0f172a" font-weight="600">By the price they advertise</text>
  <text x="850" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0f172a" font-weight="600">By the real price per hour</text>
  <text x="350" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">cheapest at the top</text>
  <text x="850" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8">cheapest at the top</text>

  <!-- 18 rows per column. Row i (1-based): y = 158 + (i-1)*27 -->
  <!-- LEFT column, x 250..450 -->
  <g fill="#e2e8f0">
    <rect x="250" y="158" width="200" height="19" rx="4"/><rect x="250" y="185" width="200" height="19" rx="4"/>
    <rect x="250" y="212" width="200" height="19" rx="4"/>
    <rect x="250" y="266" width="200" height="19" rx="4"/><rect x="250" y="293" width="200" height="19" rx="4"/>
    <rect x="250" y="320" width="200" height="19" rx="4"/><rect x="250" y="347" width="200" height="19" rx="4"/>
    <rect x="250" y="374" width="200" height="19" rx="4"/><rect x="250" y="401" width="200" height="19" rx="4"/>
    <rect x="250" y="428" width="200" height="19" rx="4"/>
    <rect x="250" y="455" width="200" height="19" rx="4"/><rect x="250" y="509" width="200" height="19" rx="4"/>
    <rect x="250" y="536" width="200" height="19" rx="4"/><rect x="250" y="563" width="200" height="19" rx="4"/>
    <rect x="250" y="590" width="200" height="19" rx="4"/><rect x="250" y="617" width="200" height="19" rx="4"/>
  </g>
  <!-- Bury: left rank 4 (y=239). Halton: left rank 13 (y=482) -->
  <rect x="250" y="239" width="200" height="19" rx="4" fill="#b45309"/>
  <rect x="250" y="482" width="200" height="19" rx="4" fill="#fbbf77"/>

  <!-- RIGHT column, x 750..950 -->
  <g fill="#e2e8f0">
    <rect x="750" y="158" width="200" height="19" rx="4"/><rect x="750" y="185" width="200" height="19" rx="4"/>
    <rect x="750" y="212" width="200" height="19" rx="4"/><rect x="750" y="239" width="200" height="19" rx="4"/>
    <rect x="750" y="266" width="200" height="19" rx="4"/><rect x="750" y="293" width="200" height="19" rx="4"/>
    <rect x="750" y="320" width="200" height="19" rx="4"/><rect x="750" y="347" width="200" height="19" rx="4"/>
    <rect x="750" y="374" width="200" height="19" rx="4"/><rect x="750" y="401" width="200" height="19" rx="4"/>
    <rect x="750" y="428" width="200" height="19" rx="4"/><rect x="750" y="455" width="200" height="19" rx="4"/>
    <rect x="750" y="482" width="200" height="19" rx="4"/><rect x="750" y="509" width="200" height="19" rx="4"/>
    <rect x="750" y="590" width="200" height="19" rx="4"/><rect x="750" y="617" width="200" height="19" rx="4"/>
  </g>
  <!-- Bury: right rank 15 (y=536). Halton: right rank 16 (y=563) -->
  <rect x="750" y="563" width="200" height="19" rx="4" fill="#fbbf77"/>
  <rect x="750" y="536" width="200" height="19" rx="4" fill="#b45309"/>

  <!-- traces -->
  <line x1="452" y1="248" x2="748" y2="545" stroke="#b45309" stroke-width="3"/>
  <line x1="452" y1="491" x2="748" y2="572" stroke="#fbbf77" stroke-width="3"/>

  <!-- labels -->
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="600">
    <text x="242" y="253" text-anchor="end" fill="#b45309">Bury &#183; 4th &#183; &#163;11.60</text>
    <text x="242" y="496" text-anchor="end" fill="#92400e">Halton &#183; 13th &#183; &#163;14.50</text>
    <text x="958" y="550" fill="#b45309">Bury &#183; 15th &#183; &#163;15.47</text>
    <text x="958" y="577" fill="#92400e">Halton &#183; 16th &#183; &#163;15.82</text>
  </g>

  <g font-family="system-ui,sans-serif" font-size="14" fill="#64748b">
    <text x="242" y="271" text-anchor="end">sells 45 minutes</text>
    <text x="242" y="514" text-anchor="end">sells 55 minutes</text>
  </g>

  <text x="600" y="655" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#0f172a">Divide the price by the minutes, multiply by sixty, then compare</text>
  <text x="1170" y="655" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
