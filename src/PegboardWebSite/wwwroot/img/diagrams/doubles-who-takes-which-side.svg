<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="A badminton court from above. A pair who were attacking in a front-and-back line have had to lift, so they must switch to side by side. Faded circles show their old attacking positions. The front player moves to one side, chosen freely, and the back player, who can see that choice, moves to the other side. They finish level with each other across the middle of their half.">
  <title>The front player picks a side; the back player takes the other</title>

  <!--
    Court block reused from doubles-attack-defence.svg. Scale 1 m = 80 units.
    BWF Laws of Badminton, Law 1 dimensions.
    Protocol per Ian Rudy, Graduates' Badminton Club Cambridge, "Court Positioning in Badminton Doubles" (2011).
  -->

  <defs>
    <marker id="move" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="lift" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#ffffff"/>
  <rect x="64" y="94" width="1072" height="488" fill="#f1f5f9"/>

  <g stroke="#64748b" stroke-width="3" fill="none">
    <rect x="64" y="94" width="1072" height="488"/>
    <line x1="64" y1="130.8" x2="1136" y2="130.8"/>
    <line x1="64" y1="545.2" x2="1136" y2="545.2"/>
    <line x1="441.6" y1="94" x2="441.6" y2="582"/>
    <line x1="758.4" y1="94" x2="758.4" y2="582"/>
    <line x1="124.8" y1="94" x2="124.8" y2="582"/>
    <line x1="1075.2" y1="94" x2="1075.2" y2="582"/>
    <line x1="64" y1="338" x2="441.6" y2="338"/>
    <line x1="758.4" y1="338" x2="1136" y2="338"/>
  </g>

  <line x1="600" y1="78" x2="600" y2="598" stroke="#0f172a" stroke-width="5"/>
  <line x1="600" y1="78" x2="600" y2="598" stroke="#ffffff" stroke-width="5" stroke-dasharray="6 6"/>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="21" fill="#0f172a">Net</text>

  <!-- the lift that forced the change -->
  <line x1="520" y1="320" x2="1000" y2="250" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#lift)"/>
  <text x="800" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#64748b">you had to lift, so the attack is theirs now</text>

  <!-- GHOSTS: the attacking front-and-back line they were in -->
  <g fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5">
    <circle cx="500" cy="338" r="26"/>
    <circle cx="240" cy="338" r="26"/>
  </g>
  <text x="500" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#64748b">was front</text>
  <text x="240" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#64748b">was back</text>

  <!-- movement -->
  <g stroke="#0f766e" stroke-width="3" marker-end="url(#move)">
    <path d="M 486 316 Q 430 250 392 222" fill="none"/>
    <path d="M 254 362 Q 320 430 356 452" fill="none"/>
  </g>

  <!-- FINAL: side by side -->
  <g fill="#b45309">
    <circle cx="374" cy="205" r="26"/>
    <circle cx="374" cy="471" r="26"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="19" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="374" y="212">1</text>
    <text x="374" y="478">2</text>
  </g>
  <line x1="374" y1="231" x2="374" y2="445" stroke="#b45309" stroke-width="2" stroke-dasharray="5 5"/>

  <text x="120" y="180" font-family="system-ui,sans-serif" font-size="21" fill="#0f766e" font-weight="600">1. The front player picks a side.</text>
  <text x="120" y="206" font-family="system-ui,sans-serif" font-size="19" fill="#475569">Either one. Do not think about it.</text>

  <text x="120" y="512" font-family="system-ui,sans-serif" font-size="21" fill="#0f766e" font-weight="600">2. The back player takes the other.</text>
  <text x="120" y="538" font-family="system-ui,sans-serif" font-size="19" fill="#475569">They can see the choice. You cannot.</text>

  <text x="600" y="628" text-anchor="middle" font-family="system-ui,sans-serif" font-size="25" fill="#0f766e" font-weight="600">Whoever can see the other player's decision is the one who adapts</text>
  <text x="600" y="656" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#475569">No agreement needed, which is why it works with a stranger</text>

  <text x="1136" y="672" text-anchor="end" font-family="system-ui,sans-serif" font-size="17" fill="#94a3b8">epegboard.com</text>
</svg>
