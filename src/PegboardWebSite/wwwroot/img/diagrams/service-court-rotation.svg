<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"
     aria-label="Three badminton courts from above, following a doubles sequence. In the first, the serving pair's score is even, so player A serves from their right service court, at the bottom left, to player C standing diagonally opposite at the top right. In the second, the serving pair has won the point, so their score is odd and the same player A has crossed to the left service court at the top left, with partner B taking the bottom left. The receiving pair have not moved at all, but because A is now at the top left, the player diagonally opposite is D at the bottom right, so D receives. In the third, the receiving pair have won the rally and become the serving side, serving from the court matching their own score, and again neither of them has changed service court.">
  <title>The serving pair swaps courts when it scores. The receiving pair never swaps at all.</title>

  <!--
    Laws of Badminton, in force 26/04/2025:
      11.1.1/11.1.2 - serving side serves from the right court on an even score, left on odd
      11.1.3 - the player of the RECEIVING side who served last stays in the same service court
      11.1.4 - the receiver is whoever stands diagonally opposite the server
      11.1.5 - players do not change service courts until they win a point when serving
      11.3.1/11.3.2 - serving side wins: same server, other court. Receiving side wins: they serve.

    COURT GEOMETRY: reuses the ePegboard court primitive unscaled in <defs> and places it with
    <use> + a uniform scale, so the proportions cannot drift. 1 m = 80 units, BWF Law 1:
    13.40 x 6.10 m = 1072 x 488 units; singles sideline 0.46 m in; short service line 1.98 m
    from the net; doubles long service line 0.76 m in from the back.
    NEVER redraw the court by eye.
  -->

  <defs>
    <g id="court">
      <rect x="0" y="0" width="1072" height="488" fill="#f1f5f9"/>
      <g stroke="#64748b" stroke-width="7" fill="none">
        <rect x="0" y="0" width="1072" height="488"/>
        <line x1="0" y1="36.8"  x2="1072" y2="36.8"/>
        <line x1="0" y1="451.2" x2="1072" y2="451.2"/>
        <line x1="377.6" y1="0" x2="377.6" y2="488"/>
        <line x1="694.4" y1="0" x2="694.4" y2="488"/>
        <line x1="60.8"  y1="0" x2="60.8"  y2="488"/>
        <line x1="1011.2" y1="0" x2="1011.2" y2="488"/>
        <line x1="0" y1="244" x2="377.6" y2="244"/>
        <line x1="694.4" y1="244" x2="1072" y2="244"/>
      </g>
      <line x1="536" y1="-18" x2="536" y2="506" stroke="#0f172a" stroke-width="9"/>
    </g>
  </defs>

  <rect width="1200" height="560" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="23" fill="#0f172a" font-weight="600">Only the serving pair changes service court</text>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">Follow C and D on the right of each court: they never move between courts</text>

  <!-- ============ PANEL 1 ============ -->
  <use href="#court" transform="translate(30,200) scale(0.33)"/>
  <text x="207" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#0f172a" font-weight="600">1. Their score is even</text>
  <line x1="115" y1="312" x2="298" y2="248" stroke="#b45309" stroke-width="3" stroke-dasharray="6 4"/>
  <g>
    <circle cx="102.6" cy="318.8" r="14" fill="#1d4ed8"/><text x="102.6" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">A</text>
    <circle cx="102.6" cy="242.2" r="14" fill="#93b4fc"/><text x="102.6" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1e3a8a" font-weight="600">B</text>
    <circle cx="310.5" cy="242.2" r="14" fill="#b45309"/><text x="310.5" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">C</text>
    <circle cx="310.5" cy="318.8" r="14" fill="#fbbf77"/><text x="310.5" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#7c2d12" font-weight="600">D</text>
  </g>
  <text x="207" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">A serves from the right court</text>
  <text x="207" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">C is diagonally opposite, so C receives</text>

  <!-- ============ PANEL 2 ============ -->
  <use href="#court" transform="translate(423,200) scale(0.33)"/>
  <text x="600" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#0f172a" font-weight="600">2. They win the point</text>
  <line x1="508" y1="248" x2="691" y2="312" stroke="#b45309" stroke-width="3" stroke-dasharray="6 4"/>
  <g>
    <circle cx="495.6" cy="242.2" r="14" fill="#1d4ed8"/><text x="495.6" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">A</text>
    <circle cx="495.6" cy="318.8" r="14" fill="#93b4fc"/><text x="495.6" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1e3a8a" font-weight="600">B</text>
    <circle cx="703.5" cy="242.2" r="14" fill="#fbbf77"/><text x="703.5" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#7c2d12" font-weight="600">C</text>
    <circle cx="703.5" cy="318.8" r="14" fill="#b45309"/><text x="703.5" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">D</text>
  </g>
  <text x="600" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">A serves again, from the other court.</text>
  <text x="600" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">C and D stayed put, so now D receives</text>

  <!-- ============ PANEL 3 ============ -->
  <use href="#court" transform="translate(816,200) scale(0.33)"/>
  <text x="993" y="172" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#0f172a" font-weight="600">3. The other pair wins the rally</text>
  <line x1="1084" y1="248" x2="901" y2="312" stroke="#b45309" stroke-width="3" stroke-dasharray="6 4"/>
  <g>
    <circle cx="888.6" cy="242.2" r="14" fill="#93b4fc"/><text x="888.6" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1e3a8a" font-weight="600">A</text>
    <circle cx="888.6" cy="318.8" r="14" fill="#1d4ed8"/><text x="888.6" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">B</text>
    <circle cx="1096.5" cy="242.2" r="14" fill="#b45309"/><text x="1096.5" y="247" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff" font-weight="600">C</text>
    <circle cx="1096.5" cy="318.8" r="14" fill="#fbbf77"/><text x="1096.5" y="324" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#7c2d12" font-weight="600">D</text>
  </g>
  <text x="993" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">They become the serving side and serve</text>
  <text x="993" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#475569">from the court matching their own score</text>

  <!-- key -->
  <g font-family="system-ui,sans-serif" font-size="15" fill="#475569">
    <circle cx="70" cy="486" r="11" fill="#1d4ed8"/>
    <circle cx="96" cy="486" r="11" fill="#93b4fc"/><text x="116" y="491">one pair</text>
    <circle cx="250" cy="486" r="11" fill="#b45309"/>
    <circle cx="276" cy="486" r="11" fill="#fbbf77"/><text x="296" y="491">the other pair</text>
    <text x="450" y="491">Solid = serving or receiving this rally. Pale = the partner, not involved in it.</text>
  </g>
  <text x="600" y="527" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#0f172a">Law 11.1.3: the receiving player who served last stays in the same service court</text>

  <text x="1170" y="527" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
