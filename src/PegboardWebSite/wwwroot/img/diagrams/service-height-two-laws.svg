<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Two servers of different heights, shown against both service-height laws. A single horizontal line at one point one five metres crosses both of them at exactly the same height above the floor, because the fixed-height law does not vary between players and is judged against a measuring device set beside the court. A second marker on each player shows the lowest rib, which sits higher off the floor on the taller player and lower on the shorter one, because the alternative law measures from the body. Under the alternative law the racket shaft and head must also point downward at the moment of contact. Rib heights are schematic and vary between individuals.">
  <title>One law is the same height for everyone; the other moves with the player</title>

  <!--
    Law 9.1.6 (BWF Laws of Badminton, in force 26/04/2025): whole shuttle below 1.15 m
    from the surface of the court at the instant of being hit.
    Alternative Service Law 9.1.6 (a) and (b) (BWF Statutes Section 4.1.4): whole shuttle
    below the server's waist, being an imaginary line level with the lowest part of the
    bottom rib; AND the shaft and racket head pointing downward.
    SCALE: 1 metre = 260 units, floor at y=600. The 1.15 m line is therefore y=301 and is
    drawn ONCE, across both figures, because that is the whole point of the diagram.
    Rib markers are SCHEMATIC - rib height varies between individuals and no ratio is asserted.
  -->

  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">Two service-height laws, both current</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#64748b">Which one applies is decided per competition, not per player</text>

  <!-- floor -->
  <line x1="60" y1="600" x2="1140" y2="600" stroke="#0f172a" stroke-width="3"/>
  <text x="60" y="624" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">Surface of the court</text>

  <!-- ===== the 1.15 m line: ONE line, both players ===== -->
  <line x1="120" y1="301" x2="1080" y2="301" stroke="#0f766e" stroke-width="3.5"/>
  <text x="1080" y="293" text-anchor="end" font-family="system-ui,sans-serif" font-size="19" fill="#0f766e" font-weight="600">Law 9.1.6: 1.15 m, the same for both</text>

  <!-- measuring device beside the court -->
  <g>
    <rect x="150" y="301" width="10" height="299" fill="#0f766e"/>
    <rect x="130" y="289" width="50" height="24" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
    <text x="155" y="650" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#0f766e">measuring<tspan x="155" dy="16">device</tspan></text>
  </g>

  <!-- ===== TALLER PLAYER (schematic, 1.85 m) ===== -->
  <g fill="#334155">
    <circle cx="420" cy="152" r="33"/>
    <rect x="399" y="188" width="42" height="150" rx="12"/>
    <rect x="401" y="336" width="16" height="264" rx="7"/>
    <rect x="423" y="336" width="16" height="264" rx="7"/>
  </g>
  <!-- rib marker -->
  <line x1="330" y1="302" x2="510" y2="302" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="420" cy="302" r="6" fill="#b45309"/>
  <text x="520" y="297" font-family="system-ui,sans-serif" font-size="16" fill="#b45309">lowest rib</text>
  <text x="420" y="648" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#334155">A taller player</text>
  <!-- racket + shuttle, angled down -->
  <line x1="441" y1="250" x2="516" y2="330" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="527" cy="343" rx="17" ry="22" fill="none" stroke="#334155" stroke-width="5" transform="rotate(42 527 343)"/>
  <circle cx="527" cy="372" r="9" fill="#0f172a"/>

  <!-- ===== SHORTER PLAYER (schematic, 1.62 m) ===== -->
  <g fill="#334155">
    <circle cx="830" cy="212" r="31"/>
    <rect x="811" y="245" width="40" height="132" rx="12"/>
    <rect x="813" y="375" width="15" height="225" rx="7"/>
    <rect x="834" y="375" width="15" height="225" rx="7"/>
  </g>
  <!-- rib marker, LOWER off the floor than the taller player's -->
  <line x1="740" y1="339" x2="920" y2="339" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5"/>
  <circle cx="830" cy="339" r="6" fill="#b45309"/>
  <text x="930" y="334" font-family="system-ui,sans-serif" font-size="16" fill="#b45309">lowest rib</text>
  <text x="830" y="648" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#334155">A shorter player</text>
  <!-- racket + shuttle, angled down -->
  <line x1="851" y1="300" x2="926" y2="372" stroke="#334155" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="937" cy="384" rx="17" ry="22" fill="none" stroke="#334155" stroke-width="5" transform="rotate(42 937 384)"/>
  <circle cx="937" cy="412" r="9" fill="#0f172a"/>

  <text x="1010" y="470" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">Rib heights are<tspan x="1010" dy="18">schematic and vary</tspan><tspan x="1010" dy="18">between players</tspan></text>

  <!-- key -->
  <g font-family="system-ui,sans-serif" font-size="16" fill="#475569">
    <rect x="60" y="96" width="16" height="4" fill="#0f766e"/>
    <text x="86" y="103">Fixed height, judged against a device</text>
    <rect x="430" y="96" width="16" height="4" fill="#b45309"/>
    <text x="456" y="103">Alternative law: below the rib, racket pointing down</text>
  </g>

  <text x="1140" y="663" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
