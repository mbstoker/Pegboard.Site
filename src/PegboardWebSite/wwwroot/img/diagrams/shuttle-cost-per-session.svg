<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img"
     aria-label="Three stacked panels about shuttle cost. The first shows a feather tube holding twelve shuttles beside a Mavis-type nylon tube holding six, illustrating that tube sizes are not consistent and prices must be divided by the number in the tube before they can be compared. Hybrids and synthetic-feather shuttles are also sold in twelves. The second shows the resulting price per shuttle as two horizontal range bars read from UK retailers on 26 August 2026: feather runs from about ninety-five pence to about four pounds twenty-five, and common branded nylon from about one pound to about two pounds thirty-five, so the entire common-nylon range sits inside the feather range and the two overlap completely, though the nylon floor clears the feather floor by only about five pence. That nylon band is scoped to recognisable branded shuttles a club would put on court; cheaper recreational and coaching nylon exists below it, at around eighty-three pence a shuttle, and undercuts every feather shuttle read. The third gives the arithmetic: cost per session equals the tube price divided by the number in the tube, multiplied by the shuttles your club actually uses in a session, with that last figure left blank because no credible published figure for it exists and the reader must measure their own.">
  <title>Tube sizes are not consistent, and once you divide, the two price ranges overlap completely</title>

  <!--
    Pack sizes: every UK retailer surveyed sells feather in tubes of 12 and nylon in tubes of 6.
    Price bands read 26 August 2026 - published as BANDS, not as a price table, because the
    underlying figures were retrieved by an automated reader that disagreed with itself within a
    single retailer. See the build-pack hedge list.
      feather  ~£11 to ~£51 per tube of 12  =  ~£0.95 to ~£4.25 per shuttle
      nylon    ~£6  to ~£14 per tube of 6   =  ~£1.00 to ~£2.35 per shuttle   <- COMMON BRANDED nylon
    SCOPING, and it is load-bearing: the nylon floor is where recognisable branded nylon starts
    (Victor 500, Carlton T800/C100 at £5.99/6; Yonex Mavis 10 at £6.50; mainstream Mavis 300/600
    nearer £11-£14), NOT the bottom of the UK market. Recreational/coaching nylon goes lower -
    Zsig £4.99 for six, about 83p each. INCLUDE THOSE AND THE HEADLINE CLAIM BELOW IS FALSE,
    because 83p undercuts the 95p feather floor. Do not widen the band without redrawing the
    conclusion (Mike, 2026-08-26).
    SCALE on the range bars: £0 at x=200, 200 units per £1.
    The third term is deliberately blank. No credible club-level breakage rate exists.
  -->

  <rect width="1200" height="675" fill="#ffffff"/>

  <text x="600" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">Divide by what is in the tube before you compare anything</text>

  <!-- ===== PANEL 1: the pack sizes ===== -->
  <text x="330" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#0f766e" font-weight="600">Feather tube</text>
  <rect x="270" y="100" width="120" height="150" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/>
  <g fill="#0f766e">
    <circle cx="297" cy="125" r="8"/><circle cx="330" cy="125" r="8"/><circle cx="363" cy="125" r="8"/>
    <circle cx="297" cy="155" r="8"/><circle cx="330" cy="155" r="8"/><circle cx="363" cy="155" r="8"/>
    <circle cx="297" cy="185" r="8"/><circle cx="330" cy="185" r="8"/><circle cx="363" cy="185" r="8"/>
    <circle cx="297" cy="215" r="8"/><circle cx="330" cy="215" r="8"/><circle cx="363" cy="215" r="8"/>
  </g>
  <text x="330" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#0f172a" font-weight="700">12</text>

  <text x="870" y="86" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" fill="#1d4ed8" font-weight="600">Nylon tube</text>
  <rect x="810" y="100" width="120" height="150" rx="10" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <g fill="#1d4ed8">
    <circle cx="837" cy="125" r="8"/><circle cx="870" cy="125" r="8"/><circle cx="903" cy="125" r="8"/>
    <circle cx="837" cy="155" r="8"/><circle cx="870" cy="155" r="8"/><circle cx="903" cy="155" r="8"/>
  </g>
  <text x="870" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" fill="#0f172a" font-weight="700">6</text>

  <text x="600" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" fill="#b45309" font-weight="600">vs</text>
  <text x="600" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Two tubes.</text>
  <text x="600" y="218" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Not two</text>
  <text x="600" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#475569">comparable prices.</text>

  <!-- ===== PANEL 2: per-shuttle ranges ===== -->
  <line x1="60" y1="312" x2="1140" y2="312" stroke="#e2e8f0" stroke-width="2"/>
  <text x="60" y="344" font-family="system-ui,sans-serif" font-size="19" fill="#0f172a" font-weight="600">Price per shuttle, once you have divided</text>
  <text x="60" y="366" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">UK retailers, read 26 August 2026. Bands, not quotes - individual prices move constantly.</text>

  <!-- axis: £0 at x=200, 200 units per £1 -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="400" y1="390" x2="400" y2="520"/><line x1="600" y1="390" x2="600" y2="520"/>
    <line x1="800" y1="390" x2="800" y2="520"/><line x1="1000" y1="390" x2="1000" y2="520"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">
    <text x="400" y="540">&#163;1</text><text x="600" y="540">&#163;2</text><text x="800" y="540">&#163;3</text><text x="1000" y="540">&#163;4</text>
  </g>

  <!-- feather: £0.95 to £4.25 -->
  <rect x="390" y="400" width="660" height="30" rx="6" fill="#0f766e" opacity="0.85"/>
  <text x="200" y="421" font-family="system-ui,sans-serif" font-size="16" fill="#0f766e" font-weight="600">Feather</text>
  <text x="382" y="421" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#0f766e">&#163;0.95</text>
  <text x="1058" y="421" font-family="system-ui,sans-serif" font-size="14" fill="#0f766e">&#163;4.25</text>

  <!-- nylon: £1.00 to £2.35   (scale: £0 at x=200, 200 units per £1) -->
  <rect x="400" y="446" width="270" height="30" rx="6" fill="#1d4ed8" opacity="0.85"/>
  <text x="200" y="467" font-family="system-ui,sans-serif" font-size="16" fill="#1d4ed8" font-weight="600">Nylon</text>
  <text x="392" y="467" text-anchor="end" font-family="system-ui,sans-serif" font-size="14" fill="#1d4ed8">&#163;1</text>
  <text x="678" y="467" font-family="system-ui,sans-serif" font-size="14" fill="#1d4ed8">&#163;2.35</text>

  <text x="200" y="506" font-family="system-ui,sans-serif" font-size="16" fill="#b45309" font-weight="600">The whole common-nylon range sits inside the feather range.</text>
  <text x="200" y="527" font-family="system-ui,sans-serif" font-size="13" fill="#94a3b8">Branded club nylon only, and the floor clears feather by 5p. Cheaper recreational nylon (~83p) undercuts every feather shuttle.</text>

  <!-- ===== PANEL 3: the arithmetic ===== -->
  <line x1="60" y1="562" x2="1140" y2="562" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="system-ui,sans-serif" font-size="20" fill="#0f172a">
    <text x="60" y="606" font-weight="600">Cost per session</text>
    <text x="253" y="606">=</text>
    <text x="285" y="606">tube price &#247; number in the tube</text>
    <text x="640" y="606">&#215;</text>
  </g>
  <rect x="668" y="583" width="290" height="32" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="813" y="606" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" fill="#b45309" font-weight="600">shuttles YOUR club uses</text>
  <text x="60" y="644" font-family="system-ui,sans-serif" font-size="15" fill="#64748b">The last figure is left blank because no credible published breakage rate for club play exists, from us or anyone else. Count three sessions.</text>

  <text x="1160" y="663" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
