<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img"
     aria-label="One half of a badminton court seen from above, with the net at the top, showing the six corners a player moves to. Two front corners sit just behind the net on the forehand and backhand sides, two middle corners sit level with each other across the midcourt, and two rear corners sit near the back boundary on the forehand and backhand sides. A base marker sits centrally between them, slightly behind the short service line. Arrows radiate from the base to each of the six corners. A note records that the corners are named by forehand and backhand rather than left and right, so the naming holds for left-handed players, and that the base is a position you split from rather than a fixed spot you must always return to.">
  <title>The six corners, named by forehand and backhand so the map works for either hand</title>

  <!--
    COURT GEOMETRY: reuses the ePegboard court primitive, one half only, placed with <use> plus a
    uniform scale so proportions cannot drift. 1 m = 80 units, BWF Law 1: 13.40 x 6.10 m =
    1072 x 488 units; singles sideline 0.46 m in; short service line 1.98 m from the net;
    doubles long service line 0.76 m in from the back. NEVER redraw the court by eye.

    The six-corner model is a coaching construction, not BWF terminology - the Level 1 manual
    publishes FOUR movement patterns (forehand and backhand forecourt, forehand and backhand
    rearcourt) and treats forecourt/midcourt/rearcourt as stroke areas. The corner POSITIONS here
    are illustrative of where those areas sit; they are not measured coordinates from any source.

    NAMING: forehand/backhand rather than left/right, deliberately. Left/right flips for a
    left-hander and half the coaching web publishes it that way without saying so.
  -->

  <defs>
    <g id="halfcourt">
      <rect x="0" y="0" width="536" height="488" fill="#f1f5f9"/>
      <g stroke="#64748b" stroke-width="7" fill="none">
        <rect x="0" y="0" width="536" height="488"/>
        <line x1="0" y1="36.8"  x2="536" y2="36.8"/>
        <line x1="0" y1="451.2" x2="536" y2="451.2"/>
        <line x1="377.6" y1="0" x2="377.6" y2="488"/>
        <line x1="60.8"  y1="0" x2="60.8"  y2="488"/>
        <line x1="0" y1="244" x2="377.6" y2="244"/>
      </g>
      <line x1="536" y1="-18" x2="536" y2="506" stroke="#0f172a" stroke-width="9"/>
    </g>
  </defs>

  <rect width="1200" height="620" fill="#ffffff"/>

  <text x="600" y="40" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#0f172a" font-weight="600">The six corners</text>
  <text x="600" y="66" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#64748b">Your half of the court, net on the right. Named by forehand and backhand, so it holds for either hand.</text>

  <!-- half court, scaled 0.82: 536x488 -> 440x400, placed at (330,110) -->
  <use href="#halfcourt" transform="translate(330,110) scale(0.82)"/>
  <text x="790" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#0f172a">Net</text>

  <!-- corner positions, native half-court coords scaled 0.82 and offset (330,110):
       front  x=430  -> 330+352.6 = 682.6
       middle x=270  -> 330+221.4 = 551.4
       rear   x=90   -> 330+73.8  = 403.8
       forehand side y=130 -> 110+106.6 = 216.6 ; backhand side y=358 -> 110+293.6 = 403.6
       base   x=330 -> 330+270.6 = 600.6 ; y=244 -> 110+200.1 = 310.1 -->

  <!-- arrows from base to each corner -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5">
    <line x1="600.6" y1="310.1" x2="682.6" y2="216.6"/>
    <line x1="600.6" y1="310.1" x2="682.6" y2="403.6"/>
    <line x1="600.6" y1="310.1" x2="551.4" y2="216.6"/>
    <line x1="600.6" y1="310.1" x2="551.4" y2="403.6"/>
    <line x1="600.6" y1="310.1" x2="403.8" y2="216.6"/>
    <line x1="600.6" y1="310.1" x2="403.8" y2="403.6"/>
  </g>

  <!-- the six corners -->
  <g fill="#0f766e">
    <circle cx="682.6" cy="216.6" r="20"/>
    <circle cx="682.6" cy="403.6" r="20"/>
    <circle cx="551.4" cy="216.6" r="20"/>
    <circle cx="551.4" cy="403.6" r="20"/>
    <circle cx="403.8" cy="216.6" r="20"/>
    <circle cx="403.8" cy="403.6" r="20"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="682.6" y="222">1</text><text x="682.6" y="409">2</text>
    <text x="551.4" y="222">3</text><text x="551.4" y="409">4</text>
    <text x="403.8" y="222">5</text><text x="403.8" y="409">6</text>
  </g>

  <!-- base -->
  <circle cx="600.6" cy="310.1" r="17" fill="#1d4ed8"/>
  <circle cx="600.6" cy="310.1" r="27" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="600.6" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#1d4ed8" font-weight="600">base</text>

  <!-- key -->
  <g font-family="system-ui,sans-serif" font-size="17" fill="#0f172a">
    <text x="820" y="180" font-weight="600">Front</text>
    <text x="820" y="206">1  forehand front</text>
    <text x="820" y="230">2  backhand front</text>
    <text x="820" y="278" font-weight="600">Middle</text>
    <text x="820" y="304">3  forehand mid</text>
    <text x="820" y="328">4  backhand mid</text>
    <text x="820" y="376" font-weight="600">Rear</text>
    <text x="820" y="402">5  forehand rear</text>
    <text x="820" y="426">6  backhand rear, often called round-the-head</text>
  </g>

  <text x="60" y="530" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Corners are named by forehand and backhand, not left and right, so the map does not flip for a left-handed player.</text>
  <text x="60" y="556" font-family="system-ui,sans-serif" font-size="16" fill="#475569">Base is where you split from before your opponent hits. BWF calls it a fluid position rather than a fixed point, so treat</text>
  <text x="60" y="582" font-family="system-ui,sans-serif" font-size="16" fill="#475569">the marker as a starting default rather than somewhere you must always return to.</text>

  <text x="1160" y="604" text-anchor="end" font-family="system-ui,sans-serif" font-size="15" fill="#94a3b8">epegboard.com</text>
</svg>
